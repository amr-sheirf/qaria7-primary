<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الشكاوى والمقترحات | مدرسة قرية 7 الابتدائية</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="site-header"></div>

<section class="section">
  <div class="container">
    <div class="section-head">
      <div>
        <h2>تقديم طلب أو شكوى أو مقترح</h2>
        <p class="sub">يسعدنا تلقي استفساراتكم وملاحظاتكم للتواصل المباشر مع إدارة المدرسة</p>
      </div>
    </div>

    <form id="requestForm" class="search-card">
      <div class="field-row">
        <div class="field">
          <label for="reqName">اسم ولي الأمر / مقدم الطلب *</label>
          <input type="text" id="reqName" required placeholder="مثال: أحمد محمد علي">
        </div>
        <div class="field">
          <label for="reqPhone">رقم الهاتف للتواصل *</label>
          <input type="tel" id="reqPhone" required placeholder="مثال: 01012345678" dir="ltr" style="text-align:right;">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="reqType">نوع الطلب</label>
          <select id="reqType">
            <option value="طلب إداري">طلب إداري</option>
            <option value="شكوى">شكوى</option>
            <option value="مقترح">مقترح لتطوير المدرسة</option>
            <option value="استفسار">استفسار عام</option>
          </select>
        </div>
        <div class="field">
          <label for="reqAddress">العنوان أو صلة القرابة بالطالب</label>
          <input type="text" id="reqAddress" placeholder="مثال: ولي أمر الطالب ... في الصف ...">
        </div>
      </div>

      <div class="field">
        <label for="reqMessage">تفاصيل الطلب أو الشكوى أو المقترح *</label>
        <textarea id="reqMessage" required placeholder="اكتب رسالتك أو استفسارك بالتفصيل هنا ..."></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="reqSubmitBtn">إرسال إلى إدارة المدرسة</button>

      <div id="reqState"></div>
    </form>
  </div>
</section>

<div id="site-footer"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/requests.js"></script>
<script>
  renderHeader("requests");
  renderFooter();
  initRequestsPage();
</script>
</body>
</html>
